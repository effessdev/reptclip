name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu catches the POSIX-only branches and the git-parity tests;
        # Windows catches the NTFS alternate-data-stream and junction branches.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p ./

      - name: Test
        # Runs the suite and fails if it found no tests: `node --test` exits 0
        # on an empty run, which would let a release ship with a green gate.
        run: node scripts/check-test-plan.mjs
