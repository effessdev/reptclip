
name: Publish VS Code Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:

  # ------------------------------------------
  # JOB 0: Tests — a release cannot ship red
  # ------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p ./

      - name: Test
        # Runs the suite and fails if it found no tests: `node --test` exits 0
        # on an empty run, which would let a release ship with a green gate.
        run: node scripts/check-test-plan.mjs

  # ------------------------------------------
  # JOB 1: Build and package the extension
  # ------------------------------------------
  build:
    name: Build VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download and verify Git LFS files
        run: |
          git lfs pull
          git lfs fsck

      - name: Validate extension metadata and release version
        run: |
          node <<'NODE'
          const p = require('./package.json');

          const expectedPublisher = 'effessdev';
          const expectedName = 'reptclip-for-vscode';
          const tag = process.env.GITHUB_REF_NAME;
          const tagVersion = tag.replace(/^v/, '');

          if (p.publisher !== expectedPublisher) {
            throw new Error(`Wrong publisher: ${p.publisher}`);
          }

          if (p.name !== expectedName) {
            throw new Error(`Wrong extension name: ${p.name}`);
          }

          if (!/^\d+\.\d+\.\d+$/.test(p.version)) {
            throw new Error(`Invalid stable version: ${p.version}`);
          }

          if (p.version !== tagVersion) {
            throw new Error(
              `Version mismatch: package.json=${p.version}, tag=${tag}`
            );
          }

          if (!p.scripts || !p.scripts['vscode:prepublish']) {
            throw new Error('Missing vscode:prepublish script');
          }

          console.log(`Validated ${p.publisher}.${p.name} v${p.version}`);
          NODE

      - name: Package extension
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VSIX="reptclip-for-vscode-${VERSION}.vsix"

          npx --yes @vscode/vsce@4.1.1 package --out "$VSIX"

          if [ ! -s "$VSIX" ]; then
            echo "VSIX file missing or empty!"
            exit 1
          fi

          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-vsix
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------
  # JOB 2: Publish to both marketplaces
  # ------------------------------------------
  publish:
    name: Publish Extensions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, test]

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extension-vsix
          path: dist

      - name: Publish to Visual Studio Marketplace
        run: |
          VSIX=$(find dist -maxdepth 1 -type f -name '*.vsix' -print -quit)

          if [ -z "$VSIX" ]; then
            echo "VSIX artifact not found!"
            exit 1
          fi

          npx --yes @vscode/vsce@4.1.1 publish \
            --packagePath "$VSIX" \
            --oidc

      - name: Publish to Open VSX
        run: |
          VSIX=$(find dist -maxdepth 1 -type f -name '*.vsix' -print -quit)

          if [ -z "$VSIX" ]; then
            echo "VSIX artifact not found!"
            exit 1
          fi

          npx --yes ovsx@1.4.0 publish \
            "$VSIX" \
            --trusted-publishing
